version: '3.8'

services:
  mongodb:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=devpassword123
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build: 
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - ALLOWED_ORIGINS=http://localhost:80,http://localhost:3000,http://127.0.0.1:80
    depends_on:
      auth-service:
        condition: service_healthy
      menu-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  auth-service:
    build: 
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      - MONGO_URL=mongodb://admin:devpassword123@mongodb:27017/authdb?authSource=admin
      - JWT_SECRET=dev_jwt_secret_key_12345
      - SMTP_EMAIL=mvamarnath63@gmail.com
      - SMTP_PASS=almq llwf jtxm jwde
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  menu-service:
    build: 
      context: ./menu-service
      dockerfile: Dockerfile
    environment:
      - MONGO_URL=mongodb://admin:devpassword123@mongodb:27017/menudb?authSource=admin
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  order-service:
    build: 
      context: ./order-service
      dockerfile: Dockerfile
    environment:
      - MONGO_URL=mongodb://admin:devpassword123@mongodb:27017/orderdb?authSource=admin
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cart-service:
    build: 
      context: ./cart-service
      dockerfile: Dockerfile
    environment:
      - MONGO_URL=mongodb://admin:devpassword123@mongodb:27017/cartdb?authSource=admin
      - JWT_SECRET=dev_jwt_secret_key_12345
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  user-service:
    build: 
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      - MONGO_URL=mongodb://admin:devpassword123@mongodb:27017/userdb?authSource=admin
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo-data: